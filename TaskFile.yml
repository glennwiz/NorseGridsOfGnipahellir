version: '3'

tasks:
  run:
    cmds:
      - echo 'Running Game'
      - odin run .
    #silent: true
  build:
    cmds:
      - echo 'Building Odin'
      - odin build .
    #silent: true
  hashlife:
    cmds:
      - echo 'Running Hashlife'
      - odin run hashlife -o:speed
    #silent: true
  hashlife-test:
    cmds:
      - odin test hashlife -o:speed
    #silent: true
  hello:
    cmds:
      - echo 'Hello World from Task!'
    silent: true
